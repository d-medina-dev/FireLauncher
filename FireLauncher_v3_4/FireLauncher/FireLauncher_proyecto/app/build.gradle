plugins { id 'com.android.application' }

android {
    namespace 'com.ejemplo.launcher'
    compileSdk 34

    defaultConfig {
        applicationId 'com.ejemplo.launcher'
        minSdk 25
        targetSdk 34
        versionCode 37
        versionName '3.4'
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
